<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Ofrecer apoyo vecinal')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div><main class="container py-4"><div class="content-card mx-auto" style="max-width:700px"><a th:href="@{/emergencias/grupos}" class="small text-decoration-none">← Volver</a><h1 class="h3 fw-bold mt-2">Ofrecer apoyo a vecinos</h1><p class="muted">Comparte cómo pueden contactarte y qué tipo de ayuda puedes brindar.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/emergencias/grupos/nuevo}" method="post" class="row g-3"><div class="col-md-8"><label class="form-label">Nombre o referencia *</label><input class="form-control" name="nombre" maxlength="140" required placeholder="Ej. Vecinos de la zona"></div><div class="col-md-4"><label class="form-label">Tipo *</label><select class="form-select" name="tipo" required><option>Vecino voluntario</option><option>Grupo vecinal</option><option>Organización</option></select></div><div class="col-md-6"><label class="form-label">¿Qué apoyo ofreces? *</label><select class="form-select" name="categoria" required><option>Salud</option><option>Alimentos y agua</option><option>Refugio</option><option>Transporte</option><option>Rescate y seguridad</option><option>Insumos y herramientas</option><option>Apoyo emocional</option><option>Comunicaciones</option><option>Otro</option></select></div><div class="col-md-6"><label class="form-label">Zona donde puedes ayudar</label><input class="form-control" name="zonaCobertura" maxlength="100" placeholder="Ej. Cercado, Arequipa"></div><div class="col-12"><label class="form-label">Descripción breve *</label><textarea class="form-control" name="descripcion" rows="3" maxlength="2000" required placeholder="Indica qué puedes ofrecer y bajo qué condiciones."></textarea></div><div class="col-md-6"><label class="form-label">Teléfono de contacto *</label><input class="form-control" name="telefono" maxlength="40" type="tel" required placeholder="+51 999 999 999"></div><div class="col-md-6"><label class="form-label">Disponibilidad</label><input class="form-control" name="disponibilidad" maxlength="160" placeholder="Ej. De 8 a. m. a 6 p. m."></div><div class="col-12"><label class="form-label">Ubicación (opcional)</label><input id="latitud" type="hidden" name="latitud"><input id="longitud" type="hidden" name="longitud"><div class="location-picker"><div class="input-group mb-2"><input id="location-search" class="form-control" placeholder="Busca una dirección o lugar"><button id="location-search-btn" type="button" class="btn btn-outline-secondary">Buscar</button></div><div id="location-map" class="location-picker-map"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" id="use-location" class="btn btn-outline-secondary btn-sm">Usar mi ubicación actual</button><span id="location-status" class="form-text align-self-center">Busca un lugar o toca el mapa para marcarlo.</span></div></div></div><div class="col-12"><button class="btn btn-bc">Publicar contacto</button> <a th:href="@{/emergencias/grupos}" class="btn btn-outline-secondary">Cancelar</a></div></form></div></main><div th:replace="~{fragments :: footer}"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script th:src="@{/js/location-picker.js}"></script><div th:replace="~{layout :: scripts}"></div></body></html>
