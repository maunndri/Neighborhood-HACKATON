<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Editar recurso vecinal')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div><main class="container py-4"><div class="content-card mx-auto" style="max-width:700px"><a th:href="@{/emergencias/grupos}" class="small text-decoration-none">← Volver a recursos vecinales</a><h1 class="h3 fw-bold mt-2">Editar mi recurso</h1><p class="muted">Actualiza la información para que los vecinos puedan encontrarte y contactarte.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/emergencias/grupos/{id}/editar(id=${grupo.id})}" method="post" class="row g-3"><div class="col-md-8"><label class="form-label">Nombre o referencia *</label><input class="form-control" name="nombre" maxlength="140" required th:value="${grupo.nombre}"></div><div class="col-md-4"><label class="form-label">Tipo *</label><select class="form-select" name="tipo" required><option value="Vecino voluntario" th:selected="${grupo.tipo == 'Vecino voluntario'}">Vecino voluntario</option><option value="Grupo vecinal" th:selected="${grupo.tipo == 'Grupo vecinal'}">Grupo vecinal</option><option value="Organización" th:selected="${grupo.tipo == 'Organización'}">Organización</option></select></div><div class="col-md-6"><label class="form-label">¿Qué apoyo ofreces? *</label><select class="form-select" name="categoria" required><option value="Salud" th:selected="${grupo.categoria == 'Salud'}">Salud</option><option value="Alimentos y agua" th:selected="${grupo.categoria == 'Alimentos y agua'}">Alimentos y agua</option><option value="Refugio" th:selected="${grupo.categoria == 'Refugio'}">Refugio</option><option value="Transporte" th:selected="${grupo.categoria == 'Transporte'}">Transporte</option><option value="Rescate y seguridad" th:selected="${grupo.categoria == 'Rescate y seguridad'}">Rescate y seguridad</option><option value="Insumos y herramientas" th:selected="${grupo.categoria == 'Insumos y herramientas'}">Insumos y herramientas</option><option value="Apoyo emocional" th:selected="${grupo.categoria == 'Apoyo emocional'}">Apoyo emocional</option><option value="Comunicaciones" th:selected="${grupo.categoria == 'Comunicaciones'}">Comunicaciones</option><option value="Otro" th:selected="${grupo.categoria == 'Otro'}">Otro</option></select></div><div class="col-md-6"><label class="form-label">Zona donde puedes ayudar</label><input class="form-control" name="zonaCobertura" maxlength="100" th:value="${grupo.zonaCobertura}" placeholder="Ej. Cercado, Arequipa"></div><div class="col-12"><label class="form-label">Descripción breve *</label><textarea class="form-control" name="descripcion" rows="3" maxlength="2000" required th:text="${grupo.descripcion}"></textarea></div><div class="col-md-6"><label class="form-label">Teléfono de contacto *</label><input class="form-control" name="telefono" maxlength="40" type="tel" required th:value="${grupo.telefono}" placeholder="+51 999 999 999"></div><div class="col-md-6"><label class="form-label">Disponibilidad</label><input class="form-control" name="disponibilidad" maxlength="160" th:value="${grupo.disponibilidad}" placeholder="Ej. De 8 a. m. a 6 p. m."></div><div class="col-12"><label class="form-label">Ubicación (opcional)</label><input id="latitud" type="hidden" name="latitud" th:value="${grupo.latitud}"><input id="longitud" type="hidden" name="longitud" th:value="${grupo.longitud}"><div class="location-picker"><div class="input-group mb-2"><input id="location-search" class="form-control" placeholder="Busca una dirección o lugar"><button id="location-search-btn" type="button" class="btn btn-outline-secondary">Buscar</button></div><div id="location-map" class="location-picker-map"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" id="use-location" class="btn btn-outline-secondary btn-sm">Usar mi ubicación actual</button><span id="location-status" class="form-text align-self-center">Puedes mover el marcador o tocar otro punto del mapa.</span></div></div></div><div class="col-12"><button class="btn btn-bc">Guardar cambios</button> <a th:href="@{/emergencias/grupos}" class="btn btn-outline-secondary">Cancelar</a></div></form></div></main><div th:replace="~{fragments :: footer}"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script th:src="@{/js/location-picker.js}"></script><div th:replace="~{layout :: scripts}"></div></body></html>
