<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Crear cuenta')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div><div class="container"><div class="auth-wrap content-card"><h1 class="h3 fw-bold">Únete a tu comunidad</h1><p class="muted">Crea tu cuenta de vecino y encuentra publicaciones cercanas.</p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/registro}" method="post" class="vstack gap-3"><div><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" required></div><div><label class="form-label">Correo electrónico</label><input class="form-control" type="email" name="correo" required></div><div><label class="form-label">Zona o barrio</label><input class="form-control" name="zona" placeholder="Ej. Tiabaya, Arequipa"></div><div><label class="form-label">Teléfono o WhatsApp</label><input class="form-control" name="telefono" type="tel" placeholder="+51 999 999 999"></div><div><label class="form-label">Ubicación de referencia</label><p class="small muted">Comparte tu ubicación para encontrar publicaciones cercanas. Puedes configurarla después.</p><input id="latitud" type="hidden" name="latitud"><input id="longitud" type="hidden" name="longitud"><div class="location-picker"><div class="input-group mb-2"><input id="location-search" class="form-control" placeholder="Busca una dirección o lugar"><button id="location-search-btn" type="button" class="btn btn-outline-secondary">Buscar</button></div><div id="location-map" class="location-picker-map"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" id="use-location" class="btn btn-outline-secondary btn-sm">Usar mi ubicación actual</button><span id="location-status" class="form-text align-self-center">Busca un lugar o toca el mapa para marcarlo.</span></div></div></div><div><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" minlength="6" required></div><button class="btn btn-bc btn-lg">Crear cuenta</button></form><p class="small mt-3 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p></div></div><div th:replace="~{fragments :: footer}"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script th:src="@{/js/location-picker.js}"></script><div th:replace="~{layout :: scripts}"></div></body></html>
