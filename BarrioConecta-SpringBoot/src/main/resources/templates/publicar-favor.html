<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Publicar favor')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div><div class="container py-4"><div class="content-card mx-auto" style="max-width:720px"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<h1 class="h3 fw-bold">Cadena de favores</h1><p class="muted">Tres pasos: elige, cuéntanos y publica.</p>
<form th:action="@{/favores/nuevo}" method="post" class="vstack gap-3" data-offline="true" data-offline-label="tu publicación">
 <div class="type-choice">
  <input type="radio" name="tipo" id="t-solicito" value="solicito" th:checked="${tipo == 'solicito'}"><label for="t-solicito" class="type-card need"><i class="bi bi-hand-index-thumb-fill"></i><strong>Necesito ayuda</strong><small>Herramientas, transporte, alimentos, apoyo temporal</small></label>
  <input type="radio" name="tipo" id="t-ofrezco" value="ofrezco" th:checked="${tipo == 'ofrezco'}"><label for="t-ofrezco" class="type-card give"><i class="bi bi-gift-fill"></i><strong>Quiero ayudar</strong><small>Préstamos, donaciones, habilidades y tiempo</small></label>
 </div>
 <div class="row g-3">
  <div class="col-md-6"><label class="form-label">Categoría</label><select class="form-select" name="categoria" required><option value="" disabled selected>Elige una categoría</option><option th:each="c : ${catFavor}" th:value="${c}" th:text="${c}"></option></select></div>
  <div class="col-md-6"><label class="form-label">Disponibilidad</label><input class="form-control" name="disponibilidad" list="disp-list" maxlength="100" placeholder="Ej. Esta semana, tardes"><datalist id="disp-list"><option th:each="d : ${opcionesDisponibilidad}" th:value="${d}"></option></datalist></div>
 </div>
 <div><label class="form-label">Título</label><input class="form-control" name="titulo" maxlength="160" placeholder="Ej. Necesito una escalera por un día" required></div>
 <div><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="3" required></textarea></div>
 <div><label class="form-label">Teléfono o WhatsApp (opcional)</label><input class="form-control" name="telefono" type="tel" maxlength="40" th:value="${telefonoActual}" placeholder="+51 999 999 999"><div class="form-text">Solo se comparte con el vecino cuyo ofrecimiento aceptes.</div></div>
 <div><label class="form-label">Ubicación aproximada</label><input id="latitud" type="hidden" name="latitud" th:value="${latitudActual}"><input id="longitud" type="hidden" name="longitud" th:value="${longitudActual}"><div class="location-picker"><div class="input-group mb-2"><input id="location-search" class="form-control" placeholder="Busca una dirección o lugar"><button id="location-search-btn" type="button" class="btn btn-outline-secondary">Buscar</button></div><div id="location-map" class="location-picker-map"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" id="use-location" class="btn btn-outline-secondary btn-sm">Usar mi ubicación actual</button><span id="location-status" class="form-text align-self-center">Mostramos solo una zona aproximada (~100 m), no tu puerta.</span></div></div></div>
 <div class="d-flex gap-2"><button class="btn btn-bc btn-lg">Publicar</button><a th:href="@{/favores}" class="btn btn-outline-secondary btn-lg">Cancelar</a></div>
</form></div></div><div th:replace="~{fragments :: footer}"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script th:src="@{/js/location-picker.js}"></script><div th:replace="~{layout :: scripts}"></div></body></html>
