<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title th:text="${title} + ' | Neighborhood'">Neighborhood</title>
<meta name="theme-color" content="#11785f">
<meta name="description" content="Neighborhood: servicios recomendados por vecinos, economía solidaria sin dinero y soporte comunitario en emergencias.">
<link rel="manifest" th:href="@{/manifest.webmanifest}">
<link rel="icon" type="image/svg+xml" th:href="@{/images/brand/neighborhood-mark.svg}">
<link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
<link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/apple-touch-icon.png}">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script><script th:src="@{/js/offline.js}"></script><script th:src="@{/js/tutorial.js}"></script><script th:src="@{/js/notificaciones.js}"></script></div>
</body></html>
