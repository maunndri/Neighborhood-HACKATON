<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Publicar')}"></head><body><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: sos-bubble}"></div><div class="container py-4"><div class="content-card mx-auto" style="max-width:760px"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><h1 class="h3 fw-bold">Publicar en mi comunidad</h1><p class="muted">Comparte un servicio o producto. Tus vecinos podrán darte su Visto Bueno.</p>
<form th:action="@{/servicios/nuevo}" method="post" enctype="multipart/form-data" class="row g-3"><div class="col-md-6"><label class="form-label">¿Qué publicarás?</label><select class="form-select" name="tipo"><option value="servicio">Servicio</option><option value="producto">Producto</option></select></div><div class="col-md-6"><label class="form-label">Categoría</label><input class="form-control" name="categoria" list="cats-servicio" placeholder="Ej. Gasfitería, alimentos" required><datalist id="cats-servicio"><option th:each="c : ${catServicio}" th:value="${c}"></option></datalist></div><div class="col-12"><label class="form-label">Título</label><input class="form-control" name="titulo" maxlength="160" required></div><div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="4" required></textarea></div><div class="col-12"><label class="form-label">Imagen (opcional)</label><input class="form-control" type="file" name="imagen" accept="image/*"><div class="form-text">Máximo 5 MB.</div></div><div class="col-md-6"><label class="form-label">Precio (S/, opcional)</label><input class="form-control" type="number" min="0" step=".01" name="precio"></div><div class="col-md-6"><label class="form-label">WhatsApp o teléfono</label><input class="form-control" name="contacto" type="tel" th:value="${telefonoActual}" placeholder="+51 999 999 999"></div><div class="col-12"><label class="form-label">Ubicación (aproximada)</label><input id="latitud" type="hidden" name="latitud" th:value="${latitudActual}"><input id="longitud" type="hidden" name="longitud" th:value="${longitudActual}"><div class="location-picker"><div class="input-group mb-2"><input id="location-search" class="form-control" placeholder="Busca una dirección o lugar"><button id="location-search-btn" type="button" class="btn btn-outline-secondary">Buscar</button></div><div id="location-map" class="location-picker-map"></div><div class="d-flex flex-wrap gap-2 mt-2"><button type="button" id="use-location" class="btn btn-outline-secondary btn-sm">Usar mi ubicación actual</button><span id="location-status" class="form-text align-self-center">Si no marcas nada, usaremos la ubicación de tu perfil.</span></div></div></div><div class="col-12 d-flex gap-2"><button class="btn btn-bc">Publicar</button><a th:href="@{/servicios}" class="btn btn-outline-secondary">Cancelar</a></div></form></div></div><div th:replace="~{fragments :: footer}"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script th:src="@{/js/location-picker.js}"></script><div th:replace="~{layout :: scripts}"></div></body></html>
