spring.application.name=BarrioConecta
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/barrio_conecta_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

# Archivos subidos por usuarios
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Barrio Conecta ----
# Datos de demostración (solo se cargan si la base está vacía). Pon false para empezar sin datos.
barrioconecta.demo-data=true
# Cuenta de administración (moderación). CAMBIA la contraseña antes de publicar el sitio.
barrioconecta.admin.correo=admin@barrioconecta.pe
barrioconecta.admin.password=Admin12345
